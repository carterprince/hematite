[package]
name = "hematite"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A small native vault text editor"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39"

[profile.dev]
debug = 0
